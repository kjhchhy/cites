    body { max-width:760px; margin:0 auto; padding:48px 24px; font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif; color:#172033; line-height:1.75; background:#f8fafc; }
    h1 { font-size:clamp(2rem,5vw,3rem); line-height:1.2; } h2 { margin-top:42px; }
    .lead { color:#526075; font-size:1.1rem; } .box { padding:18px 20px; background:#eff6ff; border-left:4px solid #2563eb; border-radius:0 10px 10px 0; } a { color:#1d4ed8; }

<body>
  <a href="../index.html">← 용어집으로 돌아가기</a>
  <h1>HTML</h1>
  <p class="lead"><strong>웹페이지에 어떤 내용이 있고, 그 내용이 어떤 순서로 놓이는지 정하는 언어</strong>입니다.</p>
  <h2>쉬운 비유</h2>
  <div class="box">HTML은 집의 <strong>뼈대와 방 배치도</strong>와 같습니다. 거실, 주방, 침실이 어디에 있을지를 정하듯 제목, 문단, 사진, 버튼이 페이지의 어디에 있을지 정합니다.</div>
  <h2>수업에서 기억할 점</h2>
  <p>HTML은 웹페이지의 <strong>내용과 구조</strong>를 담당합니다. 예쁘게 꾸미는 일은 CSS, 클릭했을 때 움직이게 하는 일은 JavaScript가 맡습니다.</p>
