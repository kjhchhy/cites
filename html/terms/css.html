<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CSS | 개발 용어집</title>
  <style>
    body { max-width:760px; margin:0 auto; padding:48px 24px; font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif; color:#172033; line-height:1.75; background:#f8fafc; }
    h1 { font-size:clamp(2rem,5vw,3rem); line-height:1.2; } h2 { margin-top:42px; }
    .lead { color:#526075; font-size:1.1rem; } .box { padding:18px 20px; background:#eff6ff; border-left:4px solid #2563eb; border-radius:0 10px 10px 0; } a { color:#1d4ed8; }
  </style>
</head>
<body>
  <a href="../index.html">← 용어집으로 돌아가기</a>
  <h1>CSS</h1>
  <p class="lead"><strong>웹페이지의 색, 글꼴, 크기, 간격, 배치를 꾸미는 언어</strong>입니다.</p>
  <h2>쉬운 비유</h2>
  <div class="box">CSS는 집의 <strong>인테리어</strong>와 같습니다. 같은 방 배치라도 벽지 색, 가구, 조명에 따라 전혀 다른 분위기가 만들어지듯 HTML로 만든 페이지의 모습을 바꿉니다.</div>
  <h2>수업에서 기억할 점</h2>
  <p>CSS는 페이지의 <strong>보이는 모습</strong>을 담당합니다. HTML로 내용을 만들고 CSS로 예쁘고 읽기 편하게 꾸민다고 기억하면 됩니다.</p>
</body>
</html>
