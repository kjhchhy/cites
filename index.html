<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>개발 용어, 쉽게 배우기</title>
  <style>
    :root { color-scheme: light; --ink:#172033; --blue:#2563eb; --soft:#eff6ff; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:system-ui, -apple-system, "Malgun Gothic", sans-serif; color:var(--ink); background:#f8fafc; line-height:1.65; }
    main { max-width:850px; margin:0 auto; padding:72px 24px; }
    h1 { font-size:clamp(2rem,5vw,3.4rem); margin:0 0 12px; line-height:1.2; }
    .intro { font-size:1.15rem; color:#475569; max-width:650px; }
    nav { margin-top:42px; }
    h2 { font-size:1.15rem; margin:0 0 14px; }
    .card { display:block; color:inherit; text-decoration:none; background:white; border:1px solid #dbeafe; border-radius:16px; padding:24px; box-shadow:0 4px 16px #0f172a0a; transition:.15s; }
    .card:hover { transform:translateY(-2px); border-color:#93c5fd; }
    .tag { color:var(--blue); font-weight:700; font-size:.9rem; }
    .card h3 { margin:4px 0; font-size:1.35rem; }
    .card p { margin:0; color:#64748b; }
    footer { margin-top:52px; color:#64748b; font-size:.9rem; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>개발 용어,<br>일상 언어로 풀어보기</h1>
      <p class="intro">처음 듣는 개발 용어를 어려운 정의 대신 익숙한 비유와 예시로 설명합니다.</p>
    </header>
    <nav aria-label="용어 카테고리">
      <h2>카테고리</h2>
      <a class="card" href="html/index.html">
        <span class="tag">전체 용어집</span>
        <h3>개발 용어 한눈에 보기</h3>
        <p>카테고리별 개발 용어와 쉬운 설명을 모아 봅니다.</p>
      </a>
      <a class="card" href="html/web-basics/html-and-index.html">
        <span class="tag">웹 기초</span>
        <h3>HTML과 index.html</h3>
        <p>웹페이지의 뼈대는 무엇이고, 홈페이지의 첫 문은 왜 index.html일까요?</p>
      </a>
    </nav>
    <footer>새 용어는 알맞은 카테고리에 계속 추가할 수 있어요.</footer>
  </main>
</body>
</html>
